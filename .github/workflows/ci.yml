name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege by default; the deploy job below asks for the extra Pages permissions it needs.
permissions:
  contents: read

jobs:
  test:
    # Pinned rather than ubuntu-latest so a runner-image OS upgrade (e.g. ubuntu-latest -> Ubuntu 26)
    # happens as a deliberate change here, not silently underneath an unrelated commit's CI run.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore UnitTestingCookbook.sln

      # README code blocks are generated from the source by MarkdownSnippets (see CLAUDE.md). Regenerating
      # them must be a no-op - otherwise a source change was committed without re-running `dotnet mdsnippets`.
      - name: Check README snippets are up to date
        run: |
          dotnet tool restore
          dotnet mdsnippets
          if ! git diff --exit-code -- '*.md'; then
            echo "::error::README snippets are out of date - run 'dotnet mdsnippets' locally and commit the result."
            exit 1
          fi

      - name: Build
        run: dotnet build UnitTestingCookbook.sln --no-restore --configuration Release

      # A handful of tests are tagged _fails / _false_negative and fail by design - they
      # demonstrate assertion error messages and a deliberate test-isolation bug (see
      # CLAUDE.md). Excluded here so CI's pass/fail reflects only tests meant to pass.
      - name: Test
        run: dotnet test UnitTestingCookbook.sln --no-build --configuration Release --filter "TestCategory!=_fails&TestCategory!=_false_negative" --logger "console;verbosity=normal" --settings coverage.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults

      # Builds the coverage report (HTML + badge) and adds a summary to the run's Summary page. Informational
      # only - no threshold, never fails the build (see README/README_CodeCoverage.md for why).
      - name: Code coverage report
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:CoverageReport -reporttypes:"Html;Badges;MarkdownSummaryGithub"
          cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Only pushes to main publish the report - pull requests still get the Summary, but never overwrite the
      # published site.
      - name: Upload coverage report for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: CoverageReport

  # Publishes the HTML coverage report to https://keithmccreery.github.io/UnitTestingCookbook/
  deploy-coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deployment part-way; a newer push simply deploys after this one finishes.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy coverage report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
